name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Compile & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile (syntax check)
        run: python -m compileall -q .

      - name: Unit tests
        env:
          TQDM_DISABLE: "1"
        run: python -m pytest tests/ -v --tb=short

      - name: Smoke test (no network / no API key)
        run: python run_cli.py --smoke-test

      - name: Retrieval regression gate (no model or API key)
        run: python -m evaluation.run --check --output reports/evaluation.json

      - name: Upload per-question evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-py${{ matrix.python-version }}
          path: reports/evaluation.json
          if-no-files-found: warn
